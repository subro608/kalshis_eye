<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midterm Night Ops</title>
<style>
:root{
  --bg:#0b0f14; --panel:#111821; --panel2:#0e141c; --line:#1f2a36; --line2:#2a3846;
  --ink:#d6dee8; --mute:#7f8fa3; --dim:#4f5f72; --acc:#3fb6c9; --warn:#e3b341;
  --L:#4c8dff; --R:#ff5a5f; --D:#4c8dff; --Rp:#ff5a5f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans)}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font:600 12px var(--mono);letter-spacing:.14em;color:var(--acc)}
.clock{font:600 18px var(--mono);min-width:230px}
.clock small{font-size:11px;color:var(--mute);font-weight:400;margin-left:6px}
header input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:6px 9px;font:13px var(--mono);width:220px;border-radius:3px}
button{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:5px 10px;font:12px var(--mono);border-radius:3px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on{background:var(--acc);color:#001018;border-color:var(--acc)}
.sp{flex:1}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);grid-template-rows:auto auto auto;gap:10px;padding:10px 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font:600 11px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.ph .r{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
#tlwrap{grid-column:1 / -1}
#tl{display:block;width:100%;height:350px;cursor:crosshair}
#vids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px}
.vc{position:relative;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;aspect-ratio:16/9}
.vc.focus{outline:2px solid var(--acc)}
.vc video{width:100%;height:100%;display:block;object-fit:cover}
.vc .lab{position:absolute;left:0;right:0;top:0;padding:3px 6px;font:11px var(--mono);background:linear-gradient(#000c,#0000);display:flex;gap:6px}
.vc .lab b{width:8px;height:8px;border-radius:50%;margin-top:3px;flex:none}
.vc .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:11px var(--mono);color:var(--dim);background:#05080bcc}
.vc .nov{color:var(--warn)}
#big{padding:6px 6px 0}
#big video{width:100%;max-height:46vh;background:#000;display:block;border-radius:3px}
#side{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:7px 12px;color:var(--mute)}
.tabs button.on{color:var(--acc);background:var(--panel2)}
#feed{overflow:auto;height:calc(46vh + 230px);padding:4px 0}
.seg{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid #16202b}
.seg:hover{background:#15202b;cursor:pointer}
.seg .t{font:11px var(--mono);color:var(--mute)}
.seg .who{font:600 11px var(--mono)}
.seg.now{background:#132634}
mark{background:#e3b34155;color:inherit;padding:0 1px}
.grp{padding:6px 10px 2px;font:600 11px var(--mono);display:flex;gap:6px;align-items:center;position:sticky;top:0;background:var(--panel)}
.grp b{width:8px;height:8px;border-radius:50%}
.empty{padding:14px;color:var(--dim);font:12px var(--mono)}
#board{grid-column:1 / -1}
table{width:100%;border-collapse:collapse;font:12px var(--mono)}
th,td{padding:5px 8px;border-bottom:1px solid #16202b;text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500;cursor:pointer;position:sticky;top:0;background:var(--panel)}
tr:hover td{background:#15202b;cursor:pointer}
tr.sel td{background:#132634}
td.num{text-align:right}
.up{color:#58d68d}.dn{color:#ff7b72}
#boardwrap{max-height:520px;overflow:auto;min-width:0}
.boardgrid{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:0}
#mapwrap{padding:10px;border-right:1px solid var(--line)}
#map{width:100%;height:auto;display:block}
#map rect{cursor:pointer;stroke:var(--bg);stroke-width:2}
#map rect.sel{stroke:var(--warn)}
#map text{font:600 10px var(--mono);fill:#e9eef5;pointer-events:none;text-anchor:middle}
#map text.p{font-weight:400;font-size:9px;fill:#e9eef5cc}
.legend{display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--mute);margin-top:6px}
.legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#ff5a5f,#3a4250,#4c8dff)}
.maphint{font:11px var(--mono);color:var(--mute);margin-top:6px}
.rtabs{display:inline-flex;margin-left:10px}.rtabs button{border-radius:0;padding:3px 9px;text-transform:none;letter-spacing:0}
.rtabs button.on{background:var(--acc);color:#001018}
#stq{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:3px 7px;font:12px var(--mono);width:150px;border-radius:3px;text-transform:none;letter-spacing:0}
#sortsel{background:var(--bg);border:1px solid var(--line2);color:var(--ink);font:11px var(--mono);padding:3px;text-transform:none}
.cand{display:inline-flex;gap:5px;align-items:baseline;min-width:170px}.cand b{font-weight:600}
.dD{color:#7fb0ff}.dR{color:#ff8a8d}.dO{color:#c9b37a}
.win{font-size:10px;padding:0 5px;border-radius:8px;margin-left:4px}
.win.D{background:#4c8dff33;color:#9cc0ff}.win.R{background:#ff5a5f33;color:#ffb0b2}.win.O{background:#c9b37a33;color:#e5d6a8}
@media (max-width:900px){.boardgrid{grid-template-columns:1fr}#mapwrap{border-right:0;border-bottom:1px solid var(--line)}}
.pill{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--line2);color:var(--mute)}
.kpis{display:flex;gap:18px;font:12px var(--mono);color:var(--mute)}
.kpis b{color:var(--ink);font-size:15px;margin-left:4px}
@media (max-width:900px){main{grid-template-columns:1fr}#vids{grid-template-columns:repeat(2,minmax(0,1fr))}#feed{height:50vh}}
</style>
</head>
<body>
<header>
  <span class="brand">MIDTERMS 2026 // NIGHT OPS</span>
  <span class="clock" id="clock">--</span>
  <span class="kpis" id="kpis"></span>
  <span class="sp"></span>
  <input id="q" placeholder="search transcripts + chat (e.g. kalshi, senate, texas)" autocomplete="off">
  <button id="play">▶ play synced</button>
  <button data-jump="-300">−5m</button><button data-jump="-60">−1m</button><button data-jump="60">+1m</button><button data-jump="300">+5m</button>
  <span id="evbtns"></span>
</header>
<main>
  <section class="panel" id="tlwrap">
    <div class="ph">Timeline · Kalshi probability + stream coverage <span class="r" id="tlhint">click or drag to move the cursor · select a race below to overlay it</span></div>
    <canvas id="tl"></canvas>
  </section>
  <section class="panel">
    <div class="ph">Streams <span class="r" id="focusname"></span></div>
    <div id="big"><video id="bigv" controls preload="metadata"></video></div>
    <div id="vids"></div>
  </section>
  <section class="panel" id="side">
    <div class="tabs"><button data-tab="tx" class="on">Transcripts @ cursor</button><button data-tab="chat">Chat (focused)</button><button data-tab="hits">Search hits</button></div>
    <div id="feed"></div>
  </section>
  <section class="panel" id="board">
    <div class="ph">Races · price at cursor
      <span class="rtabs"><button data-kind="senate" class="on">Senate</button><button data-kind="house">House</button><button data-kind="gov">Governor</button><button data-kind="all">All</button></span>
      <input id="stq" placeholder="state / candidate" autocomplete="off">
      <select id="sortsel"><option value="delta">biggest move (60 m)</option><option value="close">closest</option><option value="vol">volume</option><option value="name">name</option></select>
      <span class="r" id="racecount"></span></div>
    <div class="boardgrid"><div id="mapwrap"><svg id="map"></svg><div class="legend"><span>R 100%</span><i></i><span>D 100%</span></div><div class="maphint" id="maphint"></div></div>
    <div id="boardwrap"><table id="tbl"></table></div></div>
  </section>
</main>
<script src="data.js"></script>
<script>
const D = window.DATA;
const $ = s => document.querySelector(s);
const ET = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
const ETs = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',hour12:true});
const fmt = t => ET.format(new Date(t*1000)) + ' ET';
const hm = t => ETs.format(new Date(t*1000));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const leanC = l => l==='L' ? css('--L') : css('--R');
const [W0,W1] = D.window;
const S = D.streams;
const K = D.kalshi;
let T = D.events[0].t - 3600, focus = S.find(s=>s.video)?.id || S[0].id, playing=false, selRace=null, query='', tab='tx';

/* ---------- Kalshi helpers ---------- */
const mkByT = Object.fromEntries(K.markets.map(m=>[m.ticker,m]));
const idx = t => Math.max(0, Math.min(K.markets[0]?.px.length-1, Math.floor((t-K.t0)/K.step)));
const pxAt = (m,t) => { const i=idx(t); return m.px[i]; };
const CTRL = [['CONTROLS-2026-D','Senate · Dem control'],['CONTROLH-2026-D','House · Dem control']].filter(([k])=>mkByT[k]);

/* ---------- timeline ---------- */
const cv = $('#tl'), cx = cv.getContext('2d');
const PAD = {l:150, r:16, t:18};
let geo = {};
function sizeCanvas(){ const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; cx.setTransform(dpr,0,0,dpr,0,0); geo={w:r.width,h:r.height}; draw(); }
const X = t => PAD.l + (t-W0)/(W1-W0)*(geo.w-PAD.l-PAD.r);
const Tx = x => W0 + (x-PAD.l)/(geo.w-PAD.l-PAD.r)*(W1-W0);
let hitsByStream = {};
function draw(){
  const w=geo.w,h=geo.h; cx.clearRect(0,0,w,h);
  const pTop=PAD.t, pH=120, lanesTop=pTop+pH+40, laneH=Math.max(14,(h-lanesTop-16)/S.length);
  // grid hours
  cx.font='10px '+css('--mono'); cx.textBaseline='top';
  for(let t=Math.ceil(W0/3600)*3600;t<=W1;t+=3600){ const x=X(t); cx.strokeStyle=css('--line'); cx.beginPath(); cx.moveTo(x,pTop); cx.lineTo(x,h-6); cx.stroke(); if(((t/3600)|0)%2===0){cx.fillStyle=css('--dim'); cx.fillText(hm(t),x+3,2);} }
  // price panel frame
  cx.fillStyle=css('--mute'); cx.textBaseline='middle';
  [0,0.5,1].forEach(v=>{const y=pTop+pH*(1-v); cx.fillText((v*100)+'%',PAD.l-34,y); cx.strokeStyle=css('--line2'); cx.setLineDash([2,3]); cx.beginPath(); cx.moveTo(PAD.l,y); cx.lineTo(w-PAD.r,y); cx.stroke(); cx.setLineDash([]);});
  cx.fillStyle=css('--ink'); cx.fillText('KALSHI',8,pTop+10);
  const line=(m,color,width,label,ly)=>{ cx.strokeStyle=color; cx.lineWidth=width; cx.beginPath(); let started=false;
    m.px.forEach((v,i)=>{ if(v==null) return; const t=K.t0+i*K.step, x=X(t), y=pTop+pH*(1-v); if(!started){cx.moveTo(x,y);started=true;} else cx.lineTo(x,y); }); cx.stroke(); cx.lineWidth=1;
    cx.fillStyle=color; cx.fillText(label,8,ly); };
  CTRL.forEach(([k,lab],i)=> line(mkByT[k], i? '#b48cff' : css('--D'), 2, lab, pTop+30+i*16));
  if(selRace && mkByT[selRace]) line(mkByT[selRace], css('--warn'), 2, ((mkByT[selRace].state||'')+(mkByT[selRace].dist?'-'+mkByT[selRace].dist:'')+' '+(mkByT[selRace].sub||'')).slice(0,22), pTop+62);
  // events
  D.events.forEach((e,i)=>{ const x=X(e.t); cx.strokeStyle=css('--warn'); cx.setLineDash([4,3]); cx.beginPath(); cx.moveTo(x,pTop); cx.lineTo(x,h-6); cx.stroke(); cx.setLineDash([]);
    cx.save(); cx.fillStyle=css('--warn'); cx.textBaseline='top'; cx.fillText('◆ '+hm(e.t)+' '+e.label, x+4, pTop+pH+2+i*11); cx.restore(); });
  // lanes
  S.forEach((s,i)=>{ const y=lanesTop+i*laneH;
    cx.fillStyle = s.id===focus? css('--acc') : css('--ink'); cx.textBaseline='middle';
    cx.fillText((s.lean==='L'?'◀ ':'▶ ')+s.name.slice(0,17)+(s.platform==='twitch'?' ·tw':''), 8, y+laneH/2);
    const x0=X(Math.max(W0,s.start)), x1=X(Math.min(W1,s.start+s.dur));
    cx.fillStyle=leanC(s.lean)+'33'; cx.fillRect(x0,y+2,Math.max(1,x1-x0),laneH-4);
    // activity: chat per minute, else transcript density
    const ch=D.chat[s.id]; let bins=[];
    if(ch){ bins=ch.per_min.map(([m,c])=>[s.start+m*60,c]); }
    else if(D.transcripts[s.id]){ const b={}; D.transcripts[s.id].forEach(g=>{const m=Math.floor(g[0]/60); b[m]=(b[m]||0)+g[2].split(' ').length;}); bins=Object.entries(b).map(([m,c])=>[s.start+m*60,c]); }
    const mx=Math.max(1,...bins.map(b=>b[1]));
    cx.fillStyle=leanC(s.lean);
    bins.forEach(([t,c])=>{ if(t<W0||t>W1) return; const hh=(laneH-4)*Math.min(1,c/mx); cx.globalAlpha=.85; cx.fillRect(X(t),y+laneH-2-hh,Math.max(1,X(t+60)-X(t)),hh); }); cx.globalAlpha=1;
    (s.clips||[]).forEach(c=>{ cx.strokeStyle=css('--acc'); cx.strokeRect(X(c.t0),y+1,Math.max(2,X(c.t1)-X(c.t0)),laneH-2); });
    (hitsByStream[s.id]||[]).forEach(t=>{ cx.fillStyle=css('--warn'); cx.fillRect(X(t)-1,y+1,2,laneH-2); });
  });
  // cursor
  const xc=X(T); cx.strokeStyle=css('--acc'); cx.lineWidth=1.5; cx.beginPath(); cx.moveTo(xc,pTop-6); cx.lineTo(xc,h-4); cx.stroke(); cx.lineWidth=1;
  CTRL.forEach(([k],i)=>{ const v=pxAt(mkByT[k],T); if(v==null) return; const y=pTop+pH*(1-v); cx.fillStyle=i?'#b48cff':css('--D'); cx.beginPath(); cx.arc(xc,y,3,0,7); cx.fill(); cx.fillText((i?'H ':'S ')+(v*100).toFixed(1)+'%', xc+6, y+10+i*13); });
}
let drag=false;
cv.addEventListener('mousedown',e=>{drag=true; setFromX(e);});
addEventListener('mousemove',e=>{ if(drag) setFromX(e); });
addEventListener('mouseup',()=>drag=false);
cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect(), y=e.clientY-r.top, lanesTop=PAD.t+120+40, laneH=Math.max(14,(geo.h-lanesTop-16)/S.length); const i=Math.floor((y-lanesTop)/laneH); if(i>=0&&i<S.length&&e.clientX-r.left<PAD.l) setFocus(S[i].id); });
function setFromX(e){ const r=cv.getBoundingClientRect(), x=e.clientX-r.left; if(x<PAD.l) return; setT(Tx(x), true); }

/* ---------- videos ---------- */
const vids = {};
$('#vids').innerHTML = S.map(s=>`<div class="vc" data-id="${s.id}"><video muted preload="metadata" playsinline></video><div class="lab"><b style="background:${leanC(s.lean)}"></b>${s.name}${s.platform==='twitch'?' · Twitch':''}</div><div class="off"></div></div>`).join('');
document.querySelectorAll('.vc').forEach(el=>{ vids[el.dataset.id]={el, v:el.querySelector('video'), off:el.querySelector('.off')}; el.onclick=()=>setFocus(el.dataset.id); });
const bigv=$('#bigv');
function setFocus(id){ focus=id; const s=S.find(x=>x.id===id); document.querySelectorAll('.vc').forEach(e=>e.classList.toggle('focus',e.dataset.id===id));
  $('#focusname').textContent = `${s.name} — ${s.title||''}`.slice(0,120);
  seekAll(true); draw(); if(tab==='chat') renderFeed(); }
function srcAt(s,t){ if(s.video){ const o=t-s.start; return (o>=0&&o<=s.dur)?{src:s.video,base:s.start,o}:null; }
  const c=(s.clips||[]).find(c=>t>=c.t0&&t<=c.t1); return c?{src:c.src,base:c.t0,o:t-c.t0}:null; }
function place(v,s,force,isBig){ const a=srcAt(s,T);
  if(!a){ if(!v.paused) v.pause(); if(isBig && v.getAttribute('src')){ v.removeAttribute('src'); v.load(); } return null; }
  if(v.getAttribute('src')!==a.src){ v.setAttribute('src',a.src); const want=a; v.addEventListener('loadedmetadata',()=>{ try{v.currentTime=T-want.base;}catch(e){} if(playing) v.play().catch(()=>{}); },{once:true}); }
  else if(force||Math.abs(v.currentTime-a.o)>3){ try{v.currentTime=a.o;}catch(e){} }
  if(playing && v.paused && v.readyState>0) v.play().catch(()=>{});
  return a; }
function seekAll(force){
  S.forEach(s=>{ const V=vids[s.id], a=place(V.v,s,force,false), o=T-s.start, onair=o>=0&&o<=s.dur;
    V.off.style.display=a?'none':'flex';
    V.off.innerHTML = !onair ? (o<0?'starts '+hm(s.start)+' ET':'ended '+hm(s.start+s.dur)+' ET')
      : (s.clips ? 'on air · video clips only ±3 min around each call' : '<span class="nov">video not downloaded</span>');
  });
  place(bigv, S.find(x=>x.id===focus), force, true);
}

/* ---------- play loop: focused big player drives the clock ---------- */
$('#play').onclick=()=>{ playing=!playing; $('#play').classList.toggle('on',playing); $('#play').textContent=playing?'❚❚ pause':'▶ play synced';
  if(playing){ bigv.play().catch(()=>{}); seekAll(true); tick(); } else { bigv.pause(); Object.values(vids).forEach(V=>V.v.pause()); } };
let lastWall=0;
function tick(now){ if(!playing) return; const s=S.find(x=>x.id===focus); const a=srcAt(s,T);
  if(a && !bigv.paused && bigv.getAttribute('src')===a.src) T=a.base+bigv.currentTime; else if(lastWall&&now) T+= (now-lastWall)/1000;
  lastWall=now||0; setT(T,false); requestAnimationFrame(tick); }

/* ---------- feed ---------- */
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => { const e=esc(s); if(!query) return e; return e.replace(new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); };
function renderFeed(){
  const f=$('#feed');
  if(tab==='tx'){
    const rows=[]; let any=false;
    S.forEach(s=>{ const tx=D.transcripts[s.id]; const o=T-s.start; if(!tx) { rows.push(`<div class="grp"><b style="background:${leanC(s.lean)}"></b>${s.name} <span class="pill">transcript pending</span></div>`); return; }
      if(o<-60||o>s.dur+60){ return; }
      const near=tx.filter(g=>g[1]>=o-50 && g[0]<=o+25); if(!near.length) return; any=true;
      rows.push(`<div class="grp"><b style="background:${leanC(s.lean)}"></b>${s.name}</div>`+near.map(g=>`<div class="seg ${g[0]<=o&&g[1]>=o?'now':''}" data-t="${s.start+g[0]}"><span class="t">${hm(s.start+g[0])}</span><span>${hl(g[2])}</span></div>`).join(''));
    });
    f.innerHTML = rows.join('') || '<div class="empty">no stream on air at this time</div>';
  } else if(tab==='chat'){
    const s=S.find(x=>x.id===focus), ch=D.chat[s.id];
    if(!ch){ f.innerHTML=`<div class="empty">no live-chat replay for ${esc(s.name)}${s.platform==='twitch'?' (Twitch chat not collected)':''}</div>`; return; }
    const o=T-s.start; const near=ch.msgs.filter(m=>m[0]>=o-240&&m[0]<=o+20);
    f.innerHTML=`<div class="grp"><b style="background:${leanC(s.lean)}"></b>${s.name} chat · ${ch.total.toLocaleString()} msgs total · sampled</div>`+
      (near.map(m=>`<div class="seg" data-t="${s.start+m[0]}"><span class="t">${hm(s.start+m[0])}</span><span><span class="who" style="color:${leanC(s.lean)}">${esc(m[1])}</span> ${hl(m[2])}</span></div>`).join('')||'<div class="empty">quiet</div>');
    f.scrollTop=f.scrollHeight;
  } else {
    if(!query){ f.innerHTML='<div class="empty">type in the search box</div>'; return; }
    const out=[]; S.forEach(s=>{ (D.transcripts[s.id]||[]).forEach(g=>{ if(g[2].toLowerCase().includes(query)) out.push([s.start+g[0],s,'tx',g[2]]); });
      (D.chat[s.id]?.msgs||[]).forEach(m=>{ if(m[2].toLowerCase().includes(query)) out.push([s.start+m[0],s,'chat',m[1]+': '+m[2]]); }); });
    out.sort((a,b)=>a[0]-b[0]);
    const byLean={L:0,R:0}; out.forEach(o=>byLean[o[1].lean]++);
    f.innerHTML=`<div class="grp">${out.length} hits · <span style="color:${css('--L')}">left ${byLean.L}</span> · <span style="color:${css('--R')}">right ${byLean.R}</span></div>`+
      out.slice(0,800).map(([t,s,k,txt])=>`<div class="seg" data-t="${t}"><span class="t">${hm(t)}</span><span><span class="who" style="color:${leanC(s.lean)}">${esc(s.name)}</span> <span class="pill">${k}</span> ${hl(txt)}</span></div>`).join('');
  }
}
$('#feed').addEventListener('click',e=>{ const r=e.target.closest('[data-t]'); if(r) setT(+r.dataset.t,true); });
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderFeed(); });
let qT; $('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ query=e.target.value.trim().toLowerCase(); computeHits(); if(query){tab='hits'; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='hits'));} renderFeed(); draw(); },200); });
function computeHits(){ hitsByStream={}; if(!query) return; S.forEach(s=>{ const a=[]; (D.transcripts[s.id]||[]).forEach(g=>{ if(g[2].toLowerCase().includes(query)) a.push(s.start+g[0]); }); (D.chat[s.id]?.msgs||[]).forEach(m=>{ if(m[2].toLowerCase().includes(query)) a.push(s.start+m[0]); }); hitsByStream[s.id]=a; }); }

/* ---------- races: one row per race (Kalshi event), all Senate / House districts / Governor ---------- */
const KIND_LBL={senate:'Senate',house:'House',gov:'Governor'};
const RACES = (()=>{ const g={}; K.markets.filter(m=>KIND_LBL[m.kind]).forEach(m=>{ (g[m.event]=g[m.event]||[]).push(m); });
  const arr=Object.entries(g).map(([ev,ms])=>{ const m0=ms[0]; ms.sort((a,b)=>'DRO'.indexOf(a.party)-'DRO'.indexOf(b.party));
    return {event:ev, kind:m0.kind, state:m0.state, dist:m0.dist, outs:ms, vol:ms.reduce((a,m)=>a+m.volume_total,0),
      label: m0.kind==='house'? `${m0.state}-${String(m0.dist).padStart(2,'0')}` : `${m0.state} ${m0.kind==='gov'?'Gov':'Sen'}${m0.dist==='special'?' (special)':''}`}; });
  // a state can have two Senate markets (party + candidate series) — keep both, mark the smaller one
  const best={}; arr.forEach(r=>{ const k=r.kind+r.state+(r.dist||''); if(!best[k]||best[k].vol<r.vol) best[k]=r; });
  arr.forEach(r=>{ r.primary = best[r.kind+r.state+(r.dist||'')]===r; if(!r.primary) r.label+=' ·alt'; });
  return arr; })();
const dAt=(r,t)=>{ const d=r.outs.find(m=>m.party==='D'), R=r.outs.find(m=>m.party==='R'); const pd=d&&pxAt(d,t), pr=R&&pxAt(R,t);
  if(pd!=null && pr!=null) return pd/(pd+pr||1); if(pd!=null) return pd; if(pr!=null) return 1-pr; return null; };
const winner=r=>{ const w=r.outs.find(m=>m.result==='yes'); return w? w : null; };
let rkind='senate', stq='', sortKey='delta', selState=null;
function divColor(p){ if(p==null) return '#1b2430'; const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  const R=[255,90,95], M=[58,66,80], B=[76,141,255]; const [a,b,t]= p<.5? [R,M,p/.5] : [M,B,(p-.5)/.5];
  return `rgb(${lerp(a[0],b[0],t)},${lerp(a[1],b[1],t)},${lerp(a[2],b[2],t)})`; }
const TILE={AK:[0,0],ME:[0,11],VT:[1,10],NH:[1,11],WA:[2,1],ID:[2,2],MT:[2,3],ND:[2,4],MN:[2,5],IL:[2,6],WI:[2,7],MI:[2,8],NY:[2,9],RI:[2,10],MA:[2,11],
 OR:[3,1],NV:[3,2],WY:[3,3],SD:[3,4],IA:[3,5],IN:[3,6],OH:[3,7],PA:[3,8],NJ:[3,9],CT:[3,10],CA:[4,1],UT:[4,2],CO:[4,3],NE:[4,4],MO:[4,5],KY:[4,6],WV:[4,7],VA:[4,8],MD:[4,9],DE:[4,10],
 AZ:[5,2],NM:[5,3],KS:[5,4],AR:[5,5],TN:[5,6],NC:[5,7],SC:[5,8],DC:[5,9],OK:[6,4],LA:[6,5],MS:[6,6],AL:[6,7],GA:[6,8],HI:[7,0],TX:[7,4],FL:[7,9]};
function renderMap(){
  const k = rkind==='all'?'senate':rkind, sz=32, gap=2, W=12*sz, H=8*sz; const svg=$('#map'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const by={}; RACES.filter(r=>r.kind===k && r.primary).forEach(r=>{ (by[r.state]=by[r.state]||[]).push(r); });
  let h=''; for(const [st,[row,col]] of Object.entries(TILE)){ const rs=by[st]; let p=null, lab='';
    if(rs){ const ps=rs.map(r=>dAt(r,T)).filter(v=>v!=null); if(ps.length){ p= k==='house'? ps.filter(v=>v>=.5).length/ps.length : ps[0]; }
      lab = k==='house'? `${ps.filter(v=>v>=.5).length}/${rs.length}` : (p==null?'':Math.round(p*100)); }
    h+=`<rect data-st="${st}" class="${selState===st?'sel':''}" x="${col*sz+gap}" y="${row*sz+gap}" width="${sz-2*gap}" height="${sz-2*gap}" rx="3" fill="${rs?divColor(p):'#141b24'}"/>`+
       `<text x="${col*sz+sz/2}" y="${row*sz+sz/2-1}" style="fill:${rs?'#e9eef5':'#3a4656'}">${st}</text>`+(rs?`<text class="p" x="${col*sz+sz/2}" y="${row*sz+sz/2+10}">${lab}</text>`:''); }
  svg.innerHTML=h;
  $('#maphint').textContent = k==='house' ? 'House: Kalshi lists only competitive districts · tile = districts leaning D / listed' : `${KIND_LBL[k]}: D win probability (%) at cursor · click a state to filter`;
}
$('#map').addEventListener('click',e=>{ const st=e.target.closest('rect')?.dataset.st; if(!st) return; selState = selState===st? null: st; $('#stq').value=selState||''; stq=(selState||'').toLowerCase(); renderBoard(); });
function renderBoard(){
  renderMap();
  let rows = RACES.filter(r=> (rkind==='all'||r.kind===rkind));
  if(stq) rows=rows.filter(r=> (r.state||'').toLowerCase()===stq || r.label.toLowerCase().includes(stq) || r.outs.some(m=>(m.sub||'').toLowerCase().includes(stq)));
  rows = rows.map(r=>{ const p=dAt(r,T), p0=dAt(r,T-3600); return {r,p,d:(p!=null&&p0!=null)?p-p0:null}; });
  const cmp={delta:(a,b)=>Math.abs(b.d||0)-Math.abs(a.d||0), close:(a,b)=>Math.abs((a.p??9)-.5)-Math.abs((b.p??9)-.5), vol:(a,b)=>b.r.vol-a.r.vol, name:(a,b)=>a.r.label.localeCompare(b.r.label)}[sortKey];
  rows.sort(cmp);
  $('#racecount').textContent = `${rows.length} races`;
  $('#tbl').innerHTML = `<tr><th>race</th><th>Democrat</th><th>Republican</th><th class="num">D win @ cursor</th><th class="num">Δ 60m</th><th>night (D)</th><th class="num">volume</th><th>winner</th></tr>` +
    rows.map(({r,p,d})=>{ const D=r.outs.find(m=>m.party==='D'), R=r.outs.find(m=>m.party==='R'), O=r.outs.filter(m=>m.party==='O'), w=winner(r);
      const c=(m,cls)=> m? `<span class="cand"><b class="${cls}">${esc(m.sub||'')}</b> ${pxAt(m,T)==null?'—':(pxAt(m,T)*100).toFixed(0)+'¢'}</span>`:'';
      const sel = r.outs.some(m=>m.ticker===selRace);
      return `<tr data-tk="${(D||R||r.outs[0]).ticker}" class="${sel?'sel':''}"><td>${r.label} <span class="pill">${KIND_LBL[r.kind]}</span></td><td>${c(D,'dD')}</td><td>${c(R,'dR')}${O.map(m=>' '+c(m,'dO')).join('')}</td>`+
        `<td class="num" style="color:${divColor(p)}">${p==null?'—':(p*100).toFixed(1)+'%'}</td><td class="num ${d>0?'up':d<0?'dn':''}">${d==null?'—':(d>0?'+':'')+(d*100).toFixed(1)}</td>`+
        `<td>${spark(D||R)}</td><td class="num">${Math.round(r.vol).toLocaleString()}</td><td>${w?`<span class="win ${w.party}">${esc(w.sub||'')}</span>`:''}</td></tr>`; }).join('');
}
function spark(m){ if(!m) return ''; const w=120,h=18, n=m.px.length, pts=[]; for(let i=0;i<n;i+=10){ const v=m.px[i]; if(v!=null) pts.push(`${(i/n*w).toFixed(1)},${(h-v*h).toFixed(1)}`);} const xc=((T-K.t0)/K.step/n*w).toFixed(1);
  return `<svg width="${w}" height="${h}"><polyline points="${pts.join(' ')}" fill="none" stroke="${m.party==='R'?css('--R'):css('--D')}" stroke-width="1"/><line x1="${xc}" x2="${xc}" y1="0" y2="${h}" stroke="${css('--warn')}"/></svg>`; }
$('#tbl').addEventListener('click',e=>{ const tr=e.target.closest('tr[data-tk]'); if(tr){ selRace = selRace===tr.dataset.tk? null : tr.dataset.tk; renderBoard(); draw(); } });
document.querySelectorAll('.rtabs button').forEach(b=>b.onclick=()=>{ rkind=b.dataset.kind; document.querySelectorAll('.rtabs button').forEach(x=>x.classList.toggle('on',x===b)); renderBoard(); });
$('#stq').addEventListener('input',e=>{ stq=e.target.value.trim().toLowerCase(); selState = stq.length===2? stq.toUpperCase(): null; renderBoard(); });
$('#sortsel').onchange=e=>{ sortKey=e.target.value; renderBoard(); };

/* ---------- clock / header ---------- */
function kpis(){ $('#kpis').innerHTML = CTRL.map(([k,l])=>{const v=pxAt(mkByT[k],T); return `${l.split(' ·')[0]} D <b>${v==null?'—':(v*100).toFixed(1)+'%'}</b>`;}).join('') + ` <span>on air <b>${S.filter(s=>T>=s.start&&T<=s.start+s.dur).length}</b></span>`; }
$('#evbtns').innerHTML = D.events.map((e,i)=>`<button data-ev="${i}" title="${esc(e.label)}">◆ ${hm(e.t)}</button>`).join(' ');
document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>setT(D.events[+b.dataset.ev].t,true));
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>setT(T+ +b.dataset.jump,true));
let lastFeed=0, lastBoard=0;
function setT(t, user){ T=Math.max(W0,Math.min(W1,t)); $('#clock').innerHTML = fmt(T).replace(' ET','<small>ET</small>'); kpis(); draw();
  if(user) seekAll(true); else seekAll(false);
  const now=performance.now(); if(user || now-lastFeed>1000){ lastFeed=now; renderFeed(); } if(user || now-lastBoard>4000){ lastBoard=now; renderBoard(); } }

addEventListener('resize', sizeCanvas);
sizeCanvas(); setFocus(focus); setT(T,true);
</script>
